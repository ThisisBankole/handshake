name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Test Go packages
        run: go test ./...

      - name: Check OpenCode plugin syntax
        run: node --check plugins/opencode/handshake.js

      - name: Check Python plugin syntax
        run: python -m py_compile plugins/claudecode/*.py plugins/codex/*.py plugins/hermes/*.py

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release + upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changelog covers since-last-tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The default GITHUB_TOKEN cannot push to other repos; this PAT
          # lets GoReleaser commit the formula into homebrew-tools.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # Public write-only PostHog key, injected into the binary at build
          # time. If the secret is unset this expands to empty and telemetry
          # is disabled in the resulting binaries.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

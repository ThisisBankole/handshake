version: 2

project_name: handshake

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/handshake
    env:
      - CGO_ENABLED=0 # modernc.org/sqlite is pure Go — clean cross-compiles
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: handshake
    repository:
      owner: ThisisBankole
      name: homebrew-tools
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/ThisisBankole/handshake
    description: Session portability daemon for AI coding agents
    binaries: [handshake]
    caveats: |
      Handshake is now installed. The setup wizard will guide you through
      registering with your agents and starting the daemon.

      If the wizard didn't run, start it manually with:
        handshake setup
    # Unsigned binary: clear the quarantine flag so Gatekeeper doesn't block it.
    # Then run the guided setup wizard automatically.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/handshake"]
          end
          system_command "#{staged_path}/handshake", args: ["setup"]